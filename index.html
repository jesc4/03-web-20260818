<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site de Noticias</title>
    <link rel="stylesheet" href="./accents/css/login/estilo.css">
    <script src="./assets/js/login.js"></script>
    <script src="https://kit.fontawesome.com/db00d7d39c.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="logo">
            <h1 class="titulo"J</h1>
        </div>
    </header>

    <div class="container">
        <h1>Login</h1>
        <form>
            <div class="input-grupo">
                <i class="fas fa-envelope"></i>
                <input id="email" type="email" placeholder="Digite seu email" />
            </div>

            <div class="input-grupo">
                <i class="fas fa-lock"></i>
                <input id="senha" type="password" placeholder="Digite sua senha" />
            </div>

            <button type="button" onclick="verificarCredenciais(); return false;">
                <i class="fas fa-sign-in-alt"></i>
                Entrar
            </button>
        </form>
    </div>

    <div class="links-auxiliares">
        <a href="#">Esqueceu sua senha?</a>
        <span>-</span>
        <a href="#">Registre-se</a>
    </div>
</body>

</html>
